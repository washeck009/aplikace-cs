<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cad">
<title>Aplikace CS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikony/ikona-192.png">
<link rel="apple-touch-icon" href="ikony/ikona-192.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app" class="app"><p class="nacitani">Načítám…</p></div>
<!-- Skenovací pole je jedno a trvalé – obrazovky ho jen zobrazují a mění popisek (skener zůstává navázaný na pole). -->
<div id="skener" class="skener" hidden>
  <div class="skener-stav"><span class="skener-text">Pole není aktivní – klepni sem</span></div>
  <label for="sken" class="skener-popisek"></label>
  <div class="scan-radek">
    <input id="sken" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button type="button" class="scan-btn scan-ok" data-ok aria-label="Potvrdit napsaný kód">OK</button>
    <button type="button" class="scan-btn" data-klavesnice aria-label="Napsat kód ručně">⌨</button>
    <button type="button" class="scan-btn" data-kamera aria-label="Skenovat kamerou">📷</button>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>Aplikace potřebuje zapnutý JavaScript.</noscript>
</body>
</html>
